<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SymSpell Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .test-result {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    input {
      padding: 8px;
      font-size: 16px;
      width: 300px;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      margin-left: 10px;
    }
    #results {
      margin-top: 20px;
    }
    pre {
      background: #f4f4f4;
      padding: 10px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>SymSpell Browser Test</h1>
  <p>Testing the browser-compatible SymSpell implementation in a Web Worker.</p>

  <div id="status" class="test-result info">Initializing...</div>

  <div style="margin-top: 20px;">
    <input type="text" id="word-input" placeholder="Enter a Khmer word..." value="បានន">
    <button onclick="checkWord()">Check Spelling</button>
    <button onclick="getSuggestions()">Get Suggestions</button>
  </div>

  <div id="results"></div>

  <h2>Batch Test</h2>
  <button onclick="runBatchTest()">Run Batch Test (500 words)</button>

  <script type="module">
    // Create worker with module support
    const worker = new Worker('/workers/symspell-test-worker.js', { type: 'module' });

    let isReady = false;

    worker.onmessage = (e) => {
      const { type, ...data } = e.data;

      if (type === 'ready') {
        isReady = true;
        document.getElementById('status').className = 'test-result success';
        document.getElementById('status').textContent =
          `Ready! Loaded ${data.wordCount.toLocaleString()} words in ${data.loadTime.toFixed(0)}ms`;
      }

      if (type === 'error') {
        document.getElementById('status').className = 'test-result error';
        document.getElementById('status').textContent = `Error: ${data.error}`;
      }

      if (type === 'checkResult') {
        addResult(`Check "${data.word}": ${data.isCorrect ? '✓ Correct' : '✗ Misspelled'}`,
          data.isCorrect ? 'success' : 'error');
      }

      if (type === 'suggestions') {
        const suggestions = data.suggestions.length > 0
          ? data.suggestions.join(', ')
          : 'No suggestions';
        addResult(`Suggestions for "${data.word}" (${data.elapsed.toFixed(1)}ms): ${suggestions}`, 'info');
      }

      if (type === 'batchCheckResult') {
        const correct = Object.values(data.results).filter(v => v).length;
        const total = Object.keys(data.results).length;
        addResult(`Batch check: ${correct}/${total} correct in ${data.elapsed.toFixed(1)}ms`, 'info');
      }
    };

    worker.onerror = (e) => {
      document.getElementById('status').className = 'test-result error';
      document.getElementById('status').textContent = `Worker error: ${e.message}`;
      console.error('Worker error:', e);
    };

    // Initialize worker
    worker.postMessage({ type: 'init', debug: true });

    function addResult(text, className) {
      const div = document.createElement('div');
      div.className = `test-result ${className}`;
      div.textContent = text;
      document.getElementById('results').prepend(div);
    }

    window.checkWord = () => {
      if (!isReady) return alert('Worker not ready');
      const word = document.getElementById('word-input').value.trim();
      if (!word) return;
      worker.postMessage({ type: 'check', word, requestId: Date.now().toString() });
    };

    window.getSuggestions = () => {
      if (!isReady) return alert('Worker not ready');
      const word = document.getElementById('word-input').value.trim();
      if (!word) return;
      worker.postMessage({ type: 'suggest', word, requestId: Date.now().toString(), debug: true });
    };

    window.runBatchTest = async () => {
      if (!isReady) return alert('Worker not ready');

      // Fetch dictionary and pick random words
      const response = await fetch('/dictionaries/km_symspell_dictionary.txt');
      const text = await response.text();
      const lines = text.split('\n').filter(l => l.trim());

      // Pick 250 real words and 250 "misspelled" words
      const realWords = [];
      const fakeWords = [];

      for (let i = 0; i < 250; i++) {
        const idx = Math.floor(Math.random() * lines.length);
        const word = lines[idx].split('\t')[0];
        realWords.push(word);
        // Create fake word by adding a character
        fakeWords.push(word + 'ន');
      }

      const testWords = [...realWords, ...fakeWords];

      addResult(`Testing batch check with ${testWords.length} words...`, 'info');
      worker.postMessage({ type: 'batchCheck', words: testWords, requestId: Date.now().toString(), debug: true });
    };
  </script>
</body>
</html>
